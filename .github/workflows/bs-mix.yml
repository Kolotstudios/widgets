# B-Sound: mixes the "B-Sound" voice tag into a sample jingle (3 times, music ducked under it).
# Started by the kolot-recorder worker (repository_dispatch "bs-mix") with a one-time token for that job.
name: bs-mix
on:
  repository_dispatch:
    types: [bs-mix]
permissions:
  contents: read
jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mix voice tag
        env:
          JOB: ${{ github.event.client_payload.job }}
          N: ${{ github.event.client_payload.n }}
          TOK: ${{ github.event.client_payload.t }}
          API: https://kolot-recorder.kolot-studios.workers.dev/
        run: |
          set -euo pipefail
          [[ "$JOB" =~ ^[0-9a-f]{24}$ ]] || { echo "bad job"; exit 1; }
          [[ "$N" =~ ^[12]$ ]] || { echo "bad n"; exit 1; }
          [[ "$TOK" =~ ^[0-9a-f]{20,64}$ ]] || { echo "bad token"; exit 1; }
          echo "::add-mask::$TOK"
          which ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          curl -fsSL -o tag.mp3 "https://www.b-sound.co.il/assets/wm/tag48.mp3"
          for i in $(seq 0 $((N-1))); do
            curl -fsSL -o in.mp3 "${API}?bsmix=get&id=${JOB}-${i}&t=${TOK}"
            D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 in.mp3)
            POS=$(python3 -c "d=float('$D');p=[0.18,0.5,0.82] if d>8 else [0.3,0.72];print(' '.join(str(int(d*x*1000)) for x in p))")
            set -- $POS; C=$#; F="[1:a]aformat=sample_rates=48000:channel_layouts=stereo,volume=0.5,asplit=$C"; L=""
            for k in $(seq 1 $C); do F="$F[t$k]"; done; F="$F;"
            k=1; for ms in $POS; do F="$F[t$k]adelay=${ms}|${ms},apad[d$k];"; L="$L[d$k]"; k=$((k+1)); done
            F="${F}${L}amix=inputs=$C:normalize=0:duration=first,asplit=2[sc][tb];[0:a]aformat=sample_rates=48000:channel_layouts=stereo[m];[m][sc]sidechaincompress=threshold=0.06:ratio=2.5:attack=20:release=300[duck];[duck][tb]amix=inputs=2:normalize=0:duration=first,alimiter=limit=0.95[out]"
            ffmpeg -v error -y -i in.mp3 -i tag.mp3 -filter_complex "$F" -map "[out]" -ar 48000 -ac 2 -c:a libmp3lame -b:a 192k out.mp3
            curl -fsS -X PUT --data-binary @out.mp3 -H "Content-Type: audio/mpeg" "${API}?bsmix=put&id=${JOB}-${i}&t=${TOK}"
            echo; echo "mixed track $i"
          done
